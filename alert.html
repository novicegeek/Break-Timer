<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Break Timer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", "Microsoft YaHei UI", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #FFFFFF;
    color: #0F172A;
    height: 100vh;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
    cursor: default;
    overflow: hidden;
  }

  .card {
    width: calc(100% - 16px);
    height: calc(100% - 16px);
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(15,23,42,.10);
    padding: 22px 22px 16px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }

  .emoji { font-size: 40px; line-height: 1; margin-bottom: 10px; }

  h1 {
    font-size: 21px; font-weight: 700; letter-spacing: .3px;
    margin-bottom: 6px;
  }
  h1.work-title  { color: #6366F1; }
  h1.break-title { color: #22C55E; }

  p {
    font-size: 14px; color: #64748B; line-height: 1.5;
    margin-bottom: 16px; padding: 0 6px;
  }

  .actions { width: 100%; margin-top: auto; }

  .btn {
    width: 100%; padding: 10px 0; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: inherit;
    transition: background .2s, transform .12s, box-shadow .2s;
  }
  .btn:active { transform: scale(.97); }

  .btn-primary { background: #6366F1; color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,.3); }
  .btn-primary:hover { background: #4F46E5; box-shadow: 0 4px 14px rgba(99,102,241,.35); }

  .btn-ghost {
    background: transparent; color: #64748B;
    border: 1.5px solid #E2E8F0; margin-top: 8px;
  }
  .btn-ghost:hover { background: #F8FAFC; color: #0F172A; border-color: #CBD5E1; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji" id="emoji">☕</div>
    <h1 id="title" class="work-title">Work Complete!</h1>
    <p id="msg">Time for a break</p>
    <div class="actions">
      <button class="btn btn-primary" id="btn-primary" data-call="alert_primary">Start Break</button>
      <button class="btn btn-ghost" id="btn-ghost" data-call="alert_extend">+5 Minutes</button>
    </div>
  </div>

<script>
  // Defaults; Python injects window.__ALERT__ into this page's <head>.
  (function () {
    var D = Object.assign({
      kind: "work", heading: "Work Complete!", msg: "Time for a break",
      primary: "Start Break", ghost: "+5 Minutes", emoji: "\u2615"
    }, window.__ALERT__ || {});

    function ready() {
      document.getElementById("emoji").textContent = D.emoji;
      var t = document.getElementById("title");
      t.textContent = D.heading;
      t.className = D.kind === "work" ? "work-title" : "break-title";
      document.getElementById("msg").textContent = D.msg;
      document.getElementById("btn-primary").textContent = D.primary;
      document.getElementById("btn-ghost").textContent = D.ghost;
    }

    // Python exposes alert_primary / alert_extend / alert_dismiss.
    // data-call makes the buttons work straight from the Python page's
    // attribute (the alert copies the page, so event handlers on injected
    // DOM nodes are not guaranteed to arrive; attributes always are).
    function call(method) {
      if (window.pywebview && window.pywebview.api) return window.pywebview.api[method]();
    }
    document.addEventListener("click", function (e) {
      var el = e.target.closest ? e.target.closest("[data-call]") : null;
      if (el) call(el.getAttribute("data-call"));
    });

    // Esc = dismiss
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { e.stopPropagation(); call("alert_dismiss"); }
    });

    if (document.readyState === "loading")
      document.addEventListener("DOMContentLoaded", ready);
    else ready();
  })();
</script>
</body>
</html>
